[package]
name = "howlstore-app"
description = "HowlStore's window: Qt Quick pages on top of howlstore-system"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "howl-store"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
howlstore-core = { path = "../howlstore-core" }
howlstore-system = { path = "../howlstore-system" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10"
